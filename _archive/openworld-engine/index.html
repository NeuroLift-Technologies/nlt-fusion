<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LT OpenWorld — Lifelike 3D Environment</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0e14;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#e8edf3; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  #hud { position:fixed; top:14px; left:14px; z-index:10; background:rgba(10,14,22,.72);
    border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:12px 14px;
    min-width:250px; backdrop-filter:blur(10px); }
  #hud h1 { font-size:15px; font-weight:700; letter-spacing:.2px; }
  #hud .sub { font-size:11px; opacity:.65; margin:2px 0 10px; }
  #hud .row { display:flex; justify-content:space-between; font-size:12px; margin-top:4px; }
  #hud .row b { font-variant-numeric:tabular-nums; }
  #hud input[type=range] { width:100%; margin-top:8px; }
  #hud .btns { display:flex; gap:6px; margin-top:8px; }
  #hud button { flex:1; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.08);
    color:#fff; border-radius:8px; padding:6px 8px; font-size:12px; cursor:pointer; }
  #hud button:hover { background:rgba(255,255,255,.16); }
  #hud button.active { background:#2f7bff; border-color:#2f7bff; }
  #help { position:fixed; bottom:14px; left:14px; z-index:10; font-size:12px; opacity:.75;
    background:rgba(10,14,22,.72); border:1px solid rgba(255,255,255,.12);
    border-radius:10px; padding:8px 12px; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#0b0e14; z-index:50; font-size:14px; letter-spacing:.3px; }
  #err { position:fixed; bottom:14px; right:14px; z-index:50; max-width:420px; display:none;
    background:#3a1020; border:1px solid #ff5b7a; border-radius:10px; padding:10px 12px; font-size:12px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="loading">Building open world…</div>
<div id="hud">
  <h1>LT OpenWorld</h1>
  <div class="sub">procedural lifelike environment · v0.1</div>
  <div class="row"><span>fps</span><b id="fps">—</b></div>
  <div class="row"><span>residents</span><b id="resident-count">—</b></div>
  <div class="row"><span>position</span><b id="pos">—</b></div>
  <div class="row"><span>time</span><b id="tod">10:00</b></div>
  <input id="timeSlider" type="range" min="0" max="24" step="0.1" value="10" />
  <input id="envIntensitySlider" type="range" min="0" max="2" step="0.1" value="1" title="Env intensity" />
  <div class="row"><span>weather</span><b id="weather-label">clear</b></div>
  <div class="btns">
    <button id="btnWalk" class="active">Walk</button>
    <button id="btnOrbit" class="">Orbit</button>
    <button id="btnDay">Day cycle</button>
  </div>
  <div class="btns">
    <button id="btnWeather">☀ Clear</button>
    <button id="btnOvercast">☁ Overcast</button>
    <button id="btnRain">🌧 Rain</button>
  </div>
</div>
<div id="help"><b>WASD</b> move · <b>mouse drag</b> look · <b>wheel</b> zoom · <b>R/F</b> up/down · <b>1/2</b> walk/orbit</div>
<div id="err"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
